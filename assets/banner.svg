  <path d="M0 6A6 6 0 016 0H894A6 6 0 01900 6" stroke="#38BDF8" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="37" cy="31" r="5" fill="#38BDF8"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="54" y="36" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="2">PLAYER_PROFILE / 01</text>
  <g clip-path="url(#reveal)">
    <text x="72" y="126" fill="#F8FAFC" font-family="monospace" font-size="68" font-weight="700" letter-spacing="8">FALCON</text>
  </g>
  <rect x="74" y="150" width="0" height="3" rx="1.5" fill="#38BDF8" filter="url(#glow)"><animate attributeName="width" from="0" to="365" begin=".7s" dur=".7s" fill="freeze"/></rect>
  <text x="74" y="183" fill="#94A3B8" font-family="monospace" font-size="15" letter-spacing="4" opacity="0">GAME DEVELOPER<animate attributeName="opacity" from="0" to="1" begin="1.15s" dur=".35s" fill="freeze"/></text>
  <g transform="translate(760 73)" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M28 0V28M14 14H42"/>
    <path d="M70 14H71M88 28H89"/>
    <path d="M8 48L0 62V91C0 99 10 102 15 96L29 78H75L89 96C94 102 104 99 104 91V62L96 48C93 43 88 40 82 40H22C16 40 11 43 8 48Z"/>
  </g>
  <text x="826" y="205" text-anchor="middle" fill="#334155" font-family="monospace" font-size="10">PRESS START</text>
