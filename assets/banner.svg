<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050810"/>
      <stop offset="1" stop-color="#081426"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#38BDF8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal"><rect x="74" y="67" width="0" height="70"><animate attributeName="width" from="0" to="610" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect></clipPath>
  </defs>
  <rect width="900" height="230" rx="14" fill="url(#bg)"/>
